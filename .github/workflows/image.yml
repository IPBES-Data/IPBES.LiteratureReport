# Builds the container image of the pipeline (docker/Dockerfile, R packages
# from renv.lock) and pushes it to ghcr.io; update.yml runs the pipeline in
# it. Runs when the Dockerfile or renv.lock change on main; also by hand
# ("Run workflow").
name: Build the pipeline image

on:
  push:
    branches:
      - main
    paths:
      - "docker/Dockerfile"
      - "renv.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/ipbes-data/ipbes-literature-report:latest
