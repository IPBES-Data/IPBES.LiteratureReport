# Publish the reports in output/report to GitHub Pages, using GitHub's
# official Pages actions. The reports are rendered locally by the targets
# pipeline and committed; this workflow only publishes them.
#
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy reports to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "output/report/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload output/report
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
